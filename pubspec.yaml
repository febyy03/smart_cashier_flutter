name: smart_cashier_flutter
description: A comprehensive Smart Cashier application with AI recommendations

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.0
  
  # Local Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  path: ^1.8.2
  
  # UI & Formatting
  intl: ^0.18.0
  fl_chart: ^0.65.0
  cupertino_icons: ^1.0.5
  
  # Image & Media
  image_picker: ^1.0.4
  
  # PDF & Export
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # Barcode Scanner
  flutter_barcode_scanner: ^2.0.0
  
  # Icons
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Add assets folder for images
  assets:
    - assets/images/
    - assets/icons/